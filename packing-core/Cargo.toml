[package]
name = "packing-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.114"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
